
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Moodboard Studio</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f5f0;
  color: #292720;
}
header {
  padding: 25px 7%;
  border-bottom: 1px solid #ddd8ce;
  display: flex;
  justify-content: space-between;
}
h1 { font-family: Georgia, serif; font-weight: normal; }
main { padding: 45px 7%; }
.subtitle { color: #777; }
button {
  background: #292720;
  color: white;
  border: 0;
  padding: 12px 20px;
  cursor: pointer;
  border-radius: 4px;
}
input {
  padding: 13px;
  border: 1px solid #ccc;
  width: 100%;
  margin: 8px 0 15px;
}
.board {
  background: white;
  padding: 20px;
  margin-top: 30px;
  border-radius: 8px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap: 15px;
  margin-top: 20px;
}
.gallery img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 5px;
}
</style>
</head>
<body>

<header>
  <strong>MOODBOARD STUDIO</strong>
  <span>Creative workspace</span>
</header>

<main>
  <p class="subtitle">YOUR CREATIVE SPACE</p>
  <h1>Wedding Moodboard Studio</h1>
  <p class="subtitle">
    Build visual stories. Plan beautiful weddings.
  </p>

  <section class="board">
    <h2>Create your moodboard</h2>

    <label>Project / Couple Name</label>
    <input id="project" placeholder="e.g. Rahul & Ananya">

    <label>Creative Direction</label>
    <input id="direction" placeholder="e.g. Editorial, cinematic, intimate">

    <label>Reference Image URL</label>
    <input id="imageUrl" placeholder="Paste an image URL">

    <button onclick="addReference()">Add Reference</button>

    <div id="gallery" class="gallery"></div>
  </section>
</main>

<script>
function addReference() {
  const url = document.getElementById("imageUrl").value.trim();
  const gallery = document.getElementById("gallery");

  if (!url) {
    alert("Please enter an image URL.");
    return;
  }

  try {
    const parsed = new URL(url);
    if (!["http:", "https:"].includes(parsed.protocol)) {
      throw new Error("Invalid URL");
    }

    const img = document.createElement("img");
    img.src = parsed.href;
    img.alt = "Moodboard reference";
    img.onerror = () => {
      alert("Image could not be loaded. Try another image URL.");
      img.remove();
    };

    gallery.appendChild(img);
    document.getElementById("imageUrl").value = "";
  } catch {
    alert("Please enter a valid image URL.");
  }
}
</script>

</body>
</html>
